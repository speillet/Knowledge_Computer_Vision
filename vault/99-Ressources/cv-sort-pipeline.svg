<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 500" role="img" aria-labelledby="title desc">
  <title id="title">SORT causal pipeline</title>
  <desc id="desc">Predicted tracks and detections feed IoU-based association, followed by track updates and lifecycle management.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#334155"/></marker></defs>
  <rect width="520" height="500" rx="12" fill="#f8fafc"/>
  <g fill="#e0f2fe" stroke="#0369a1" stroke-width="2">
    <rect x="20" y="30" width="225" height="70" rx="8"/>
    <rect x="275" y="30" width="225" height="70" rx="8"/>
    <rect x="120" y="150" width="280" height="70" rx="8"/>
    <rect x="120" y="270" width="280" height="70" rx="8"/>
    <rect x="120" y="390" width="280" height="70" rx="8"/>
  </g>
  <g fill="#0f172a" font-family="sans-serif" font-size="17" text-anchor="middle">
    <text x="132" y="60">Previous tracks</text><text x="132" y="84">→ Kalman prediction</text>
    <text x="387" y="60">Current frame</text><text x="387" y="84">→ detections + NMS</text>
    <text x="260" y="179">IoU and assignment</text><text x="260" y="203">matched / unmatched pairs</text>
    <text x="260" y="299">Update matched tracks</text><text x="260" y="323">birth / age / deletion</text>
    <text x="260" y="419">Output tracks</text><text x="260" y="443">boxes and IDs</text>
  </g>
  <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M132 100 L210 149"/><path d="M387 100 L310 149"/>
    <path d="M260 220 L260 269"/><path d="M260 340 L260 389"/>
  </g>
</svg>
