    <pattern id="bv-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#e2e8f0"/><line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="2"/></pattern>
    <marker id="bv-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#334155"/></marker>
  </defs>
  <rect width="540" height="720" rx="12" fill="#f8fafc"/>
  <text x="270" y="28" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">Two meanings of occupancy</text>

