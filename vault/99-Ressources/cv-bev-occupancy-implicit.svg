<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 720" role="img" aria-labelledby="bv-title bv-desc">
  <title id="bv-title">Two meanings of occupancy: a robot grid and an occupancy network</title>
  <desc id="bv-desc">Top: one LiDAR scan inserted into a 13 by 9 occupancy grid, the sensor at the bottom centre with a field of view of plus or minus 36 degrees and 13 rays. Cells crossed by a ray become free with probability 0.4, cells holding a return become occupied with probability 0.7, following the OctoMap sensor model with log-odds minus 0.4 and plus 0.85. Cells behind the pallet, beside the field of view and wall cells that no ray reached stay unknown: they were never updated. Bottom, schematic: an occupancy network f of p and x returns a value between 0 and 1 for any query point p of one object, given an input view x. The mesh surface is the level f equal to tau equal to 0.2, outside the level f equal to 0.5. The side hidden from the input view still receives values, from the learned shape prior. Training points are sampled in a padded bounding box; outside it the function was never supervised. The network has no unknown state, no time and no ray model.</desc>
