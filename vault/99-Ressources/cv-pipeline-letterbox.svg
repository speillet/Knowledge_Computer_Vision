<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 660" role="img" aria-labelledby="title desc">
  <title id="title">Letterbox inverse: remove the padding, then divide by the scale</title>
  <desc id="desc">A 1920 by 1080 frame is resized by r equal to one third into a 640 by 360 band, padded with 140 rows above and below to fill a 640 by 640 model input. The model box from x 320 to 416 and y 290 to 350 maps back to x 960 to 1248 and y 450 to 630 in the source. Dividing without subtracting the padding moves the box 420 source pixels down, to y 870 to 1050, with the right size.</desc>
  <defs>
    <marker id="lb-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#334155"/></marker>
    <marker id="lb-arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#b91c1c"/></marker>
    <pattern id="lb-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#e2e8f0"/><line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="3"/></pattern>
  </defs>
  <rect width="540" height="660" rx="12" fill="#f8fafc"/>
  <text x="270" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">Letterbox: remove padding, then divide</text>

  <!-- model input 640x640 at 0.375 px per unit: x 150-390, y 50-290 -->
  <text x="16" y="89" font-family="sans-serif" font-size="16" fill="#0f172a">model input</text>
  <text x="16" y="109" font-family="sans-serif" font-size="16" fill="#0f172a">640 × 640</text>
  <rect x="150" y="58" width="240" height="52.5" fill="url(#lb-hatch)"/>
  <rect x="150" y="110.5" width="240" height="135" fill="#e0f2fe"/>
  <rect x="150" y="245.5" width="240" height="52.5" fill="url(#lb-hatch)"/>
  <rect x="150" y="58" width="240" height="240" fill="none" stroke="#0369a1" stroke-width="2"/>
  <g font-family="sans-serif" font-size="16" fill="#334155">
    <text x="400" y="89">p<tspan font-size="12" dy="4">y</tspan><tspan dx="5" dy="-4">= 140</tspan></text>
    <text x="400" y="276">p<tspan font-size="12" dy="4">y</tspan><tspan dx="5" dy="-4">= 140</tspan></text>
    <text x="400" y="172">content</text>
    <text x="400" y="192">640 × 360</text>
    <text x="16" y="172">box x′ 320–416</text>
    <text x="16" y="192">y′ 290–350</text>
  </g>
  <!-- model box: x 320-416 -> 270-306, y 290-350 -> 166.75-189.25 -->
  <rect x="270" y="166.75" width="36" height="22.5" fill="none" stroke="#15803d" stroke-width="3"/>

  <!-- inverse map -->
  <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#lb-arrow)">
    <line x1="270" y1="306" x2="270" y2="350"/>
  </g>
  <g font-family="sans-serif" font-size="16" fill="#0f172a">
    <text x="282" y="326">y = (y′ − p<tspan font-size="12" dy="4">y</tspan><tspan dy="-4">) / r ,  r = 1/3</tspan></text>
    <text x="282" y="346">x = (x′ − p<tspan font-size="12" dy="4">x</tspan><tspan dy="-4">) / r ,  p</tspan><tspan font-size="12" dy="4">x</tspan><tspan dx="5" dy="-4">= 0</tspan></text>
  </g>

  <!-- source 1920x1080 at 0.25 px per unit: x 30-510, y 370-640 -->
  <text x="30" y="364" font-family="sans-serif" font-size="16" fill="#0f172a">source frame 1920 × 1080</text>
  <rect x="30" y="370" width="480" height="270" fill="#ffffff" stroke="#0369a1" stroke-width="2"/>
  <!-- true box: x 960-1248 -> 270-342, y 450-630 -> 482.5-527.5 -->
  <rect x="270" y="482.5" width="72" height="45" fill="none" stroke="#15803d" stroke-width="3"/>
  <text x="352" y="500" font-family="sans-serif" font-size="16" fill="#15803d">correct</text>
  <text x="352" y="520" font-family="sans-serif" font-size="16" fill="#15803d">y 450–630</text>
  <!-- wrong box without p_y: y 870-1050 -> 587.5-632.5 -->
  <rect x="270" y="587.5" width="72" height="45" fill="none" stroke="#b91c1c" stroke-width="3" stroke-dasharray="7 4"/>
  <text x="352" y="600" font-family="sans-serif" font-size="16" fill="#b91c1c">p<tspan font-size="12" dy="4">y</tspan><tspan dx="5" dy="-4">forgotten</tspan></text>
  <text x="352" y="620" font-family="sans-serif" font-size="16" fill="#b91c1c">y 870–1050</text>
  <g stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#lb-arrow-red)">
    <line x1="250" y1="505" x2="250" y2="603"/>
  </g>
  <text x="240" y="560" font-family="sans-serif" font-size="16" fill="#b91c1c" text-anchor="end">+420 px, same size</text>
</svg>
