  <text x="280.8" y="112" font-family="sans-serif" font-size="14" fill="#334155" text-anchor="end">reject</text>
  <text x="296.8" y="112" font-family="sans-serif" font-size="14" fill="#334155">accept</text>
  <g font-family="sans-serif" font-size="16">
    <text x="63.52" y="97.88" fill="#0369a1">impostors</text>
    <text x="63.52" y="115.88" fill="#0369a1">(nonmated)</text>
    <text x="496.48" y="97.88" fill="#15803d" text-anchor="end">genuine</text>
    <text x="496.48" y="115.88" fill="#15803d" text-anchor="end">(mated, bona fide)</text>
  </g>
  <g font-family="sans-serif" font-size="16" font-weight="bold">
    <text x="313.44" y="300" fill="#0369a1">FMR</text>
    <text x="264.16" y="300" fill="#15803d" text-anchor="end">FNMR</text>
  </g>
  <g font-family="sans-serif" font-size="16">
    <text x="62" y="422" fill="#0369a1">FMR = 1.9%: impostor comparisons with s ≥ τ</text>
    <text x="62" y="448" fill="#15803d">FNMR = 3.3%: genuine comparisons with s &lt; τ</text>
    <text x="62" y="474" fill="#b91c1c">attack (print of the enrolled face): 90% pass τ</text>
    <text x="62" y="500" fill="#0f172a">τ = 0.78 stops 95% of attacks, rejects 91% of genuine</text>
  </g>
