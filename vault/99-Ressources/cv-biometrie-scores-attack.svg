<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 530" role="img" aria-labelledby="bioatk-title bioatk-desc">
  <title id="bioatk-title">Matcher scores of impostors, genuine users and presentation attacks</title>
  <desc id="bioatk-desc">Constructed Gaussian cosine-similarity distributions, drawn to scale: impostor (nonmated) comparisons with mean 0.15 and standard deviation 0.12, genuine (mated, bona fide) comparisons with mean 0.62 and 0.12, and attacks, prints or replays of the enrolled person compared with that person's template, with mean 0.57 and 0.13. At the threshold 0.40, a comparison matches when its score is at or above it: FMR, the impostor area at or above 0.40, is 1.9%; FNMR, the genuine area below 0.40, is 3.3%; the matcher accepts 90% of the attacks. Moving the threshold to 0.78, where only 5% of attacks pass, would reject 91% of genuine users.</desc>
  <defs>
    <pattern id="bioatk-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#b91c1c" stroke-width="2.2"/></pattern>
  </defs>
  <rect width="540" height="530" rx="12" fill="#f8fafc"/>
  <text x="270" y="32" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">One matcher threshold, three populations</text>
  <text x="270" y="56" font-family="sans-serif" font-size="16" fill="#334155" text-anchor="middle">constructed scores, drawn to scale; match if s ≥ τ</text>
  <path d="M60,330 H500" stroke="#334155" stroke-width="2" fill="none"/>
  <g font-family="sans-serif" font-size="16" fill="#334155" text-anchor="middle">
    <line x1="77.6" y1="330" x2="77.6" y2="336" stroke="#334155" stroke-width="2"/><text x="77.6" y="356">−0.2</text>
    <line x1="148" y1="330" x2="148" y2="336" stroke="#334155" stroke-width="2"/><text x="148" y="356">0</text>
    <line x1="218.4" y1="330" x2="218.4" y2="336" stroke="#334155" stroke-width="2"/><text x="218.4" y="356">0.2</text>
    <line x1="288.8" y1="330" x2="288.8" y2="336" stroke="#334155" stroke-width="2"/><text x="288.8" y="356">0.4</text>
    <line x1="359.2" y1="330" x2="359.2" y2="336" stroke="#334155" stroke-width="2"/><text x="359.2" y="356">0.6</text>
    <line x1="429.6" y1="330" x2="429.6" y2="336" stroke="#334155" stroke-width="2"/><text x="429.6" y="356">0.8</text>
    <line x1="500" y1="330" x2="500" y2="336" stroke="#334155" stroke-width="2"/><text x="500" y="356">1</text>
  </g>
  <text x="280" y="380" font-family="sans-serif" font-size="16" fill="#0f172a" text-anchor="middle">cosine similarity s with the claimed template</text>
