<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 800" role="img" aria-labelledby="apdup-title apdup-desc">
  <title id="apdup-title">101-point AP: an early duplicate lowers every later precision</title>
  <desc id="apdup-desc">Constructed ranked list for one category with 4 ground-truth objects, drawn to scale. Panel A ranks TP, duplicate, TP, TP, TP: the precisions after each rank are 1, 0.5, 0.67, 0.75 and 0.8 at recalls 0.25, 0.25, 0.5, 0.75 and 1. The interpolated envelope, the maximum precision at that recall or beyond, is 1 up to recall 0.25 and 0.8 after it, so 26 of the 101 recall samples read 1 and 75 read 0.8: AP = 86/101, about 0.851; the duplicate costs 75 times 0.2 over 101, about 0.149. Panel B ranks the same five boxes with the duplicate last: precisions 1, 1, 1, 1 and 0.8, envelope 1 everywhere, AP = 101/101 = 1.</desc>
